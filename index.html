<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAGI BROKER AI • Assistente Imobiliário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Mesmos estilos do index.html fornecido + ajustes */
    .hidden { display: none !important; }
    body { background: #0a0c0f; color: #e0e0e0; font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(31,41,55,0.8); backdrop-filter: blur(12px); border: 1px solid #374151; border-radius: 48px; }
    /* ... outros estilos podem ser mantidos ou importados do style.css */
  </style>
</head>
<body>
  <nav class="navbar navbar-dark px-3 px-md-5 py-3">
    <div class="container-fluid">
      <span class="navbar-brand">NAGI BROKER AI</span>
      <div class="d-flex align-items-center gap-3">
        <span class="nagi-tag d-none d-md-block">NAGI TECHNOLOGY S.A</span>
        <div id="auth-section" class="d-flex gap-2"></div>
      </div>
    </div>
  </nav>

  <main class="container my-4 flex-grow-1">
    <!-- Loading -->
    <div id="loading-screen" class="text-center py-5 hidden">
      <div class="spinner-border text-success" role="status"></div>
      <p class="mt-3">Carregando...</p>
    </div>

    <!-- Welcome Screen -->
    <div id="welcome-screen" class="login-container hidden">
      <div class="glass-card p-5 text-center">
        <h1 class="display-4 fw-bold text-success mb-4">NAGI BROKER AI</h1>
        <p class="text-secondary mb-4">Faça login para acessar o assistente imobiliário</p>
        <button id="welcome-login-btn" class="btn btn-light btn-lg px-5 py-3 rounded-pill">
          <i class="bi bi-google me-2"></i> Entrar com Google
        </button>
      </div>
    </div>

    <!-- Plans Screen -->
    <div id="plans-screen" class="hidden"></div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="hidden"></div>
  </main>

  <footer class="text-center text-secondary py-4 border-top border-secondary">
    <span>UMINO NAGI - I WAS HERE 🍀</span>
  </footer>

  <!-- Import map e scripts -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      }
    }
  </script>

  <script type="module">
    import { iniciarUI } from './js/ui.js';
    import { abrirPainelAdmin } from './js/admin.js';
    // Expor admin globalmente para botão (se necessário)
    window.abrirPainelAdmin = abrirPainelAdmin;
    // Iniciar UI
    iniciarUI();
  </script>
</body>
</html>
